# Canlı kâğıt testi: uygulamanın GÜÇLÜ AL/AL kuralı sanal 1000 $ ile, gerçek Binance fiyatlarıyla (cointracker/forwardtest.py).
# Her gün günlük mum kapandıktan sonra (UTC 00:20 = TR 03:20) çalışır; sonuç paper/canli/RAPOR.md dosyasına yazılır.
# İlk çalıştırmada başlangıç günü ve coin listesi paper/canli/state.json'a sabitlenir.
name: forwardtest

on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forwardtest
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Günü işle ve raporu yaz
        run: python -m cointracker.forwardtest run --state paper/canli/state.json --out paper/canli/RAPOR.md --summary "$GITHUB_STEP_SUMMARY"
      - name: Raporu kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/canli/state.json paper/canli/RAPOR.md
          if git diff --cached --quiet; then echo "değişiklik yok"; exit 0; fi
          git commit -m "Canlı kâğıt testi: $(date -u +%Y-%m-%d) [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1
