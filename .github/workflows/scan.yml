# İstendiğinde şu anki GÜÇLÜ AL / AL listesini çıkarır (tools/scan_now.py); sonuç çalıştırmanın özet sayfasında.
name: scan

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tools/scan_now.py "$GITHUB_STEP_SUMMARY"
