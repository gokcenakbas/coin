# Strateji araştırması: gerçek Binance verisiyle (son 5 yıl, en büyük 40 coin) başarı oranlarını ölçer.
# Sonuçlar iş günlüğünde ve "research" artifact'ında.
name: research

on:
  push:
    branches: ["**"]
    paths:
      - "tools/research/**"
      - "cointracker/strategy.py"
      - ".github/workflows/research.yml"
  workflow_dispatch:

jobs:
  optimize:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Destek/direnç giriş ve kâr alma
        run: python tools/research/takeprofit.py
      - name: Trend kırılımı portföy testi
        run: python tools/research/breakout.py
      - name: Alım + satış kuralları
        run: python tools/research/entryexit.py
      - name: GÜÇLÜ AL incelemesi
        run: python tools/research/strongbuy.py
      - name: Hızlı hareket öncü izleri
        run: python tools/research/fastmoves.py
      - name: Piyasa rejimi analizi
        run: python tools/research/regime.py
      - name: Araştırmayı çalıştır
        run: python tools/research/optimize.py research.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research
          path: research.json
